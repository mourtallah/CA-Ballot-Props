global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'notifeed-monitor'

scrape_configs:
  - job_name: 'notifeed-api'
    static_configs:
      - targets: ['api:3000']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:9187']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
